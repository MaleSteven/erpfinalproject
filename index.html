<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TerraDig ERP Prototype</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a63;--bd:#dedcd3;--ac:#b86e00;--ok:#2f7d32;--wr:#b3261e;--bl:#245a9e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#eeede6;--mut:#a3a298;--bd:#3a3935;--ac:#e8a23a;--ok:#6fc374;--wr:#f08178;--bl:#7fb0ec;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#eeede6;--mut:#a3a298;--bd:#3a3935;--ac:#e8a23a;--ok:#6fc374;--wr:#f08178;--bl:#7fb0ec;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:18px 0 8px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.mut{color:var(--mut)}.small{font-size:12px}
.role{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);padding:8px 12px;border-radius:6px;margin:12px 0}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.pri{background:var(--bl);color:#fff;border-color:var(--bl)}
button.dg{color:var(--wr)}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}.stat b{font-size:22px;display:block}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.wide{grid-column:1/-1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mut)}
.b{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--bd)}
.ok{color:var(--ok);border-color:var(--ok)}.wr{color:var(--wr);border-color:var(--wr)}.bl{color:var(--bl);border-color:var(--bl)}.am{color:var(--ac);border-color:var(--ac)}
.msg{padding:8px 12px;border-radius:6px;margin-bottom:12px;border:1px solid}.msg.ok{background:rgba(47,125,50,.1)}.msg.wr{background:rgba(179,38,30,.1)}
.off{opacity:.5}
</style></head><body><div id="app"></div>
<script>
const RN={clerk:'Service clerk (Customer Service)',inv:'Inventory officer',mgr:'Manager'};
const RD={clerk:'Can create and view service requests, customers and machines. Stock is view-only.',inv:'Can check and update spare-parts stock. Service requests are view-only.',mgr:'Can review all requests, start, complete or cancel them, and mark records inactive.'};
const can={newReq:['clerk'],addCust:['clerk'],addEq:['clerk'],read:['clerk','mgr'],stock:['inv'],adv:['mgr'],deact:['mgr'],deactPart:['inv','mgr']};
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=()=>({
 customers:[{id:'C1',name:'Kasese Quarry Co.',phone:'0700 100 200',loc:'Kasese',active:true},{id:'C2',name:'Nile Roadworks Ltd',phone:'0700 300 400',loc:'Jinja',active:true},{id:'C3',name:'Mubende Mining Group',phone:'0700 500 600',loc:'Mubende',active:true}],
 equipment:[{id:'E1',cust:'C1',model:'TD-320 Excavator',serial:'TD320-0041',hrs:1520,last:1000,int:500,active:true},
  {id:'E2',cust:'C2',model:'TD-950 Wheel Loader',serial:'TD950-0112',hrs:2230,last:2000,int:500,active:true},
  {id:'E3',cust:'C3',model:'TD-740 Haul Truck',serial:'TD740-0007',hrs:3890,last:3500,int:400,active:true},
  {id:'E4',cust:'C1',model:'TD-140 Grader',serial:'TD140-0230',hrs:910,last:500,int:500,active:true}],
 parts:[{id:'P1',name:'Hydraulic hose kit',qty:12,min:4,active:true},{id:'P2',name:'Air filter',qty:0,min:5,active:true},{id:'P3',name:'Track pad set',qty:2,min:3,active:true},{id:'P4',name:'Engine oil filter',qty:23,min:8,active:true},{id:'P5',name:'Starter motor',qty:1,min:1,active:true}],
 requests:[{id:'R1',eq:'E2',part:'P4',qty:2,issue:'Routine oil filter change and leak check',status:'Ready to schedule',by:'clerk',date:today(),hist:[today()+': created, 2 × P4 reserved']}]
});
let db,role='clerk',tab='req',msg='',msgT='ok';
function load(){try{const s=localStorage.getItem('terradig');if(s)return JSON.parse(s)}catch(e){}return seed()}
function save(){try{localStorage.setItem('terradig',JSON.stringify(db))}catch(e){}}
db=load();
const C=id=>db.customers.find(x=>x.id===id),E=id=>db.equipment.find(x=>x.id===id),P=id=>db.parts.find(x=>x.id===id);
const due=e=>e.hrs-e.last>=e.int;
const say=(m,t)=>{msg=m;msgT=t||'ok'};
function need(a){if(can[a].includes(role))return true;say('Access denied: the '+RN[role]+' role isn’t allowed to do that.','wr');render();return false}
const nid=(arr,p)=>p+(arr.reduce((m,x)=>Math.max(m,+x.id.slice(1)),0)+1);

/* ---- core business logic (shared by UI and tests) ---- */
function tryReserve(d,r){const p=d.parts.find(x=>x.id===r.part);
 if(p.qty>=r.qty){p.qty-=r.qty;r.status='Ready to schedule';r.hist.push(today()+': '+r.qty+' × '+p.id+' reserved, ready to schedule');return true}return false}
function createReq(d,i,by){
 const e=d.equipment.find(x=>x.id===i.eq&&x.active),p=d.parts.find(x=>x.id===i.part&&x.active),q=parseInt(i.qty,10),err=[];
 if(!e)err.push('Select an active machine.');
 if(!p)err.push('Select an active spare part.');
 if(!(q>=1))err.push('Quantity must be at least 1.');
 if((i.issue||'').trim().length<10)err.push('Describe the issue (at least 10 characters).');
 if(err.length)return{ok:false,err};
 const r={id:nid(d.requests,'R'),eq:e.id,part:p.id,qty:q,issue:i.issue.trim(),by,date:today(),status:'',hist:[today()+': created']};
 if(!tryReserve(d,r)){r.status='Awaiting part';r.hist.push(today()+': '+p.id+' out of stock (have '+p.qty+', need '+q+'), purchase flagged')}
 d.requests.push(r);return{ok:true,req:r}}
function restockPart(d,id,n){const p=d.parts.find(x=>x.id===id);p.qty+=n;
 d.requests.filter(r=>r.part===id&&r.status==='Awaiting part').forEach(r=>tryReserve(d,r))}

/* ---- tests on a fresh copy of the seed data ---- */
function runTests(){
 const d=seed(),rows=[],pq=id=>d.parts.find(p=>p.id===id).qty,s1=pq('P1');
 let r=createReq(d,{eq:'E4',part:'P1',qty:1,issue:'Hydraulic hose leaking at boom cylinder'},'clerk');
 rows.push(['1. Part available','Machine E4, part P1 × 1 (stock '+s1+'), valid description','Request created, “Ready to schedule”, P1 stock '+(s1-1),r.ok?r.req.status+', P1 stock '+pq('P1'):'Rejected',r.ok&&r.req.status==='Ready to schedule'&&pq('P1')===s1-1]);
 const n=d.requests.length;
 let r2=createReq(d,{eq:'E2',part:'P2',qty:1,issue:'Engine overheating, air filter clogged'},'clerk');
 rows.push(['2. Part unavailable','Machine E2, part P2 × 1 (stock 0), valid description','Request created, “Awaiting part”, stock stays 0, purchase flagged',r2.ok?r2.req.status+', P2 stock '+pq('P2'):'Rejected',r2.ok&&r2.req.status==='Awaiting part'&&pq('P2')===0]);
 let r3=createReq(d,{eq:'',part:'P1',qty:-2,issue:'bad'},'clerk');
 rows.push(['3. Missing or invalid data','No machine, part P1, quantity −2, description “bad”','Rejected with 3 error messages; no request saved',r3.ok?'Accepted':'Rejected: '+r3.err.length+' errors; requests '+(d.requests.length===n+1?'unchanged':'changed'),!r3.ok&&r3.err.length===3&&d.requests.length===n+1]);
 restockPart(d,'P2',3);
 rows.push(['4. Restock links back (bonus)','Inventory officer adds 3 × P2','Waiting request becomes “Ready to schedule”, P2 stock 2','Request '+r2.req.id+': '+r2.req.status+', P2 stock '+pq('P2'),r2.req.status==='Ready to schedule'&&pq('P2')===2]);
 return rows}

/* ---- actions ---- */
const v=id=>document.getElementById(id).value;
function aNewReq(){if(!need('newReq'))return;const r=createReq(db,{eq:v('f_eq'),part:v('f_part'),qty:v('f_qty'),issue:v('f_issue')},role);
 if(r.ok){say('Request '+r.req.id+' created. Status: '+r.req.status+'.'+(r.req.status==='Awaiting part'?' Inventory has been flagged to purchase the part.':''),r.req.status==='Awaiting part'?'wr':'ok')}else say(r.err.join(' '),'wr');save();render()}
function aAdv(id,to){if(!need('adv'))return;const r=db.requests.find(x=>x.id===id),p=P(r.part);
 if(to==='Cancelled'&&['Ready to schedule','In progress'].includes(r.status))p.qty+=r.qty;
 if(to==='Completed'){const e=E(r.eq);e.last=e.hrs}
 r.status=to;r.hist.push(today()+': '+to+' by '+RN[role].split(' (')[0]);say(r.id+' is now '+to+'.');save();render()}
function aRestock(id){if(!need('stock'))return;const n=parseInt(v('rs_'+id),10);if(!(n>=1)){say('Enter a restock quantity of at least 1.','wr');return render()}
 restockPart(db,id,n);say(id+' restocked by '+n+'. Waiting requests were re-checked automatically.');save();render()}
function aAddPart(){if(!need('stock'))return;const n=v('p_name').trim(),q=parseInt(v('p_qty'),10),m=parseInt(v('p_min'),10);
 if(n.length<3||!(q>=0)||!(m>=0)){say('Enter a part name (3+ characters) and non-negative quantities.','wr');return render()}
 db.parts.push({id:nid(db.parts,'P'),name:n,qty:q,min:m,active:true});say('Part added.');save();render()}
function aAddCust(){if(!need('addCust'))return;const n=v('c_name').trim(),ph=v('c_phone').trim(),l=v('c_loc').trim();
 if(n.length<3||ph.length<6||!l){say('Customer name, phone and location are required.','wr');return render()}
 db.customers.push({id:nid(db.customers,'C'),name:n,phone:ph,loc:l,active:true});say('Customer added.');save();render()}
function aAddEq(){if(!need('addEq'))return;const c=v('e_cust'),m=v('e_model').trim(),s=v('e_serial').trim(),h=parseInt(v('e_hrs'),10),i=parseInt(v('e_int'),10);
 if(!c||m.length<3||s.length<3||!(h>=0)||!(i>=1)){say('Customer, model, serial, hours (≥ 0) and service interval (≥ 1) are required.','wr');return render()}
 db.equipment.push({id:nid(db.equipment,'E'),cust:c,model:m,serial:s,hrs:h,last:h,int:i,active:true});say('Machine added.');save();render()}
function aTele(id){if(!need('read'))return;const e=E(id);e.hrs+=50+Math.floor(Math.random()*100);say('Simulated reading: '+e.model+' now at '+e.hrs+' hours.');save();render()}
function aToggle(kind,id){if(!need(kind==='parts'?'deactPart':'deact'))return;const o=db[kind].find(x=>x.id===id);o.active=!o.active;say(id+(o.active?' reactivated.':' marked inactive.'));save();render()}
function setRole(v){role=v;msg='';render()}
function setTab(v){tab=v;msg='';render()}
function aReset(){db=seed();say('Demo data reset.');save();render()}

/* ---- views ---- */
const bd=(t,c)=>'<span class="b '+c+'">'+t+'</span>';
const stC={'Awaiting part':'wr','Ready to schedule':'bl','In progress':'am',Completed:'ok',Cancelled:''};
function vReq(){
 const open=db.requests.filter(r=>!['Completed','Cancelled'].includes(r.status));
 const st=[['Open requests',open.length],['Awaiting part',db.requests.filter(r=>r.status==='Awaiting part').length],['Machines due for review',db.equipment.filter(e=>e.active&&due(e)).length],['Low-stock parts',db.parts.filter(p=>p.active&&p.qty<=p.min).length]];
 const form=can.newReq.includes(role)?`<div class="card"><b>New service request</b><div class="form" style="margin-top:8px">
 <label>Machine<select id="f_eq"><option value="">— select —</option>${db.equipment.filter(e=>e.active).map(e=>`<option value="${e.id}">${e.id} · ${esc(e.model)} (${esc(C(e.cust).name)})</option>`).join('')}</select></label>
 <label>Spare part needed<select id="f_part"><option value="">— select —</option>${db.parts.filter(p=>p.active).map(p=>`<option value="${p.id}">${p.id} · ${esc(p.name)} (stock ${p.qty})</option>`).join('')}</select></label>
 <label>Quantity<input id="f_qty" type="number" value="1"></label>
 <label class="wide">Reported issue<textarea id="f_issue" rows="2" placeholder="What did the customer report?"></textarea></label>
 <button class="pri" onclick="aNewReq()">Create request &amp; check stock</button></div></div>`:`<p class="mut small">Creating requests is limited to the service clerk role.</p>`;
 const act=r=>{if(!can.adv.includes(role))return'';const b=(t,to,c)=>`<button class="${c||''}" onclick="aAdv('${r.id}','${to}')">${t}</button> `;
  if(r.status==='Ready to schedule')return b('Start work','In progress')+b('Cancel','Cancelled','dg');
  if(r.status==='In progress')return b('Complete','Completed')+b('Cancel','Cancelled','dg');
  if(r.status==='Awaiting part')return b('Cancel','Cancelled','dg');return''};
 return `<div class="grid">${st.map(s=>`<div class="stat"><b>${s[1]}</b><span class="mut small">${s[0]}</span></div>`).join('')}</div><h2></h2>${form}
 <div class="card tw"><table><tr><th>ID</th><th>Machine / customer</th><th>Part</th><th>Issue</th><th>Status</th><th>History</th><th></th></tr>
 ${db.requests.slice().reverse().map(r=>{const e=E(r.eq);return`<tr><td>${r.id}</td><td>${esc(e.model)}<br><span class="mut small">${esc(C(e.cust).name)}</span>${due(e)?'<br>'+bd('Maintenance review due','wr'):''}</td><td>${r.part} × ${r.qty}<br><span class="mut small">${esc(P(r.part).name)}</span></td><td>${esc(r.issue)}</td><td>${bd(r.status,stC[r.status])}</td><td class="mut small">${r.hist.map(esc).join('<br>')}</td><td>${act(r)}</td></tr>`}).join('')}</table></div>`}
function vEq(){
 const form=can.addEq.includes(role)?`<div class="card"><b>Register machine</b><div class="form" style="margin-top:8px"><label>Customer<select id="e_cust"><option value="">— select —</option>${db.customers.filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Model<input id="e_model"></label><label>Serial no.<input id="e_serial"></label><label>Operating hours<input id="e_hrs" type="number" value="0"></label><label>Service interval (hrs)<input id="e_int" type="number" value="500"></label><button class="pri" onclick="aAddEq()">Add machine</button></div></div>`:'';
 return `${form}<div class="card tw"><table><tr><th>ID</th><th>Machine</th><th>Customer</th><th>Hours since last service</th><th>Alert</th><th></th></tr>
 ${db.equipment.map(e=>`<tr class="${e.active?'':'off'}"><td>${e.id}</td><td>${esc(e.model)}<br><span class="mut small">${esc(e.serial)} · ${e.hrs} hrs total</span></td><td>${esc(C(e.cust).name)}</td><td>${e.hrs-e.last} / ${e.int}</td><td>${!e.active?bd('Inactive',''):due(e)?bd('Maintenance review due','wr'):bd('OK','ok')}</td><td>${can.read.includes(role)&&e.active?`<button onclick="aTele('${e.id}')">Simulate IIoT reading</button> `:''}${can.deact.includes(role)?`<button onclick="aToggle('equipment','${e.id}')">${e.active?'Mark inactive':'Reactivate'}</button>`:''}</td></tr>`).join('')}</table></div>`}
function vParts(){
 const form=can.stock.includes(role)?`<div class="card"><b>Add spare part</b><div class="form" style="margin-top:8px"><label>Name<input id="p_name"></label><label>Stock<input id="p_qty" type="number" value="0"></label><label>Reorder level<input id="p_min" type="number" value="2"></label><button class="pri" onclick="aAddPart()">Add part</button></div></div>`:`<p class="mut small">Stock changes are limited to the inventory officer role.</p>`;
 const short=p=>Math.max(0,db.requests.filter(r=>r.part===p.id&&r.status==='Awaiting part').reduce((s,r)=>s+r.qty,0)-p.qty);
 return `${form}<div class="card tw"><table><tr><th>ID</th><th>Part</th><th>Stock</th><th>Reorder level</th><th>Flags</th><th></th></tr>
 ${db.parts.map(p=>`<tr class="${p.active?'':'off'}"><td>${p.id}</td><td>${esc(p.name)}</td><td>${p.qty}</td><td>${p.min}</td><td>${!p.active?bd('Inactive',''):[p.qty<=p.min?bd('Low stock','am'):'',short(p)?bd('Purchase needed: '+short(p)+' short','wr'):''].join(' ')||bd('OK','ok')}</td><td>${can.stock.includes(role)&&p.active?`<input id="rs_${p.id}" type="number" min="1" value="5" style="width:70px"> <button onclick="aRestock('${p.id}')">Restock</button> `:''}${can.deactPart.includes(role)?`<button onclick="aToggle('parts','${p.id}')">${p.active?'Mark inactive':'Reactivate'}</button>`:''}</td></tr>`).join('')}</table></div>`}
function vCust(){
 const form=can.addCust.includes(role)?`<div class="card"><b>Add customer</b><div class="form" style="margin-top:8px"><label>Name<input id="c_name"></label><label>Phone<input id="c_phone"></label><label>Location<input id="c_loc"></label><button class="pri" onclick="aAddCust()">Add customer</button></div></div>`:'';
 return `${form}<div class="card tw"><table><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Location</th><th>Machines</th><th></th></tr>
 ${db.customers.map(c=>`<tr class="${c.active?'':'off'}"><td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.loc)}</td><td>${db.equipment.filter(e=>e.cust===c.id).length}</td><td>${can.deact.includes(role)?`<button onclick="aToggle('customers','${c.id}')">${c.active?'Mark inactive':'Reactivate'}</button>`:''}</td></tr>`).join('')}</table></div>`}
function vTest(){const rows=runTests();
 return `<div class="card tw"><table><tr><th>Test</th><th>Input</th><th>Expected</th><th>Actual</th><th>Result</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${r[4]?bd('Pass','ok'):bd('Fail','wr')}</td></tr>`).join('')}</table></div>`}
function render(){
 const tabs=[['req','Service requests'],['eq','Equipment'],['parts','Spare parts'],['cust','Customers'],['test','Tests']];
 const body={req:vReq,eq:vEq,parts:vParts,cust:vCust,test:vTest}[tab]();
 document.getElementById('app').innerHTML=`<div class="top"><div><h1>TerraDig Machinery Ltd</h1><span class="mut">Integrated Equipment Maintenance &amp; Service System · prototype</span></div>
 <label>Signed in as (simulated)<select onchange="setRole(this.value)">${Object.keys(RN).map(k=>`<option value="${k}"${k===role?' selected':''}>${RN[k]}</option>`).join('')}</select></label></div>
 <p class="role">${RD[role]}</p>
 <nav>${tabs.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}<button onclick="aReset()">Reset demo data</button></nav>
 ${msg?`<div class="msg ${msgT}">${esc(msg)}</div>`:''}${body}`}
render();
</script></body></html>
